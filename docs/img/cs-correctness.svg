<text x="720" y="381.0" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">4,902</text>
<text x="840" y="381.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">0</text>
<text x="20" y="401.0" font-size="11" fill="#6b7280">The same requests and injected faults as scenario 04, which passed in every run. This shows the oracle detects the failures it checks for.</text>
