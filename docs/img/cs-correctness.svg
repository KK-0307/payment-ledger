<text x="720" y="317.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">0</text>
<text x="840" y="317.0" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">7,064</text>
<text x="20" y="337.0" font-size="11" fill="#6b7280">All deadlocks are in the before-fix and single-row arms; after the fix: 0.</text>
<line x1="20" x2="940" y1="345.0" y2="345.0" stroke="#e5e7eb"/>
<text x="20" y="361.0" font-weight="600" fill="#111827">Ablation: idempotency and recovery switched off</text>
