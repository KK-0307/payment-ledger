<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, sans-serif" font-size="12" role="img" aria-label="Merchant sharding: p99 latency of succeeded payments (lower is better)">
<title>Merchant sharding: p99 latency of succeeded payments (lower is better)</title>
<rect width="960" height="460" fill="#ffffff"/>
<text x="70" y="22" font-size="15" font-weight="600" fill="#111827">Merchant sharding: p99 latency of succeeded payments (lower is better)</text>
<text x="70" y="38" font-size="11" fill="#4b5563">Closed loop, 10,000 payment operations, one API instance, Stripe simulator, no injected faults, no retries needed.</text>
<text x="70" y="53" font-size="11" fill="#4b5563">Median of 5 interleaved rounds per arm (whiskers: min-max). Apple M4 Max laptop, PostgreSQL 16; every component shares the host.</text>
