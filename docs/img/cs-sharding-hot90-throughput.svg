<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, sans-serif" font-size="12" role="img" aria-label="Merchant sharding: throughput when 90% of operations hit one merchant">
<title>Merchant sharding: throughput when 90% of operations hit one merchant</title>
<rect width="960" height="460" fill="#ffffff"/>
<text x="70" y="22" font-size="15" font-weight="600" fill="#111827">Merchant sharding: throughput when 90% of operations hit one merchant</text>
<text x="70" y="38" font-size="11" fill="#4b5563">Closed loop, 10,000 payment operations, one API instance, Stripe simulator, no injected faults, no retries needed.</text>
<text x="70" y="53" font-size="11" fill="#4b5563">Median of 5 interleaved rounds per arm (whiskers: min-max). Apple M4 Max laptop, PostgreSQL 16; every component shares the host.</text>
<rect x="70" y="63" width="10" height="10" fill="#6b7280"/><text x="84" y="72" fill="#374151">single-row (original)</text>
<rect x="241" y="63" width="10" height="10" fill="#2563eb"/><text x="255" y="72" fill="#374151">sharding off (new code, disabled)</text>
<rect x="496" y="63" width="10" height="10" fill="#d97706"/><text x="510" y="72" fill="#374151">sharding on (default)</text>
<line x1="70" x2="940" y1="330.0" y2="330.0" stroke="#e5e7eb"/><text x="64" y="334.0" text-anchor="end" fill="#6b7280">0</text>
<line x1="70" x2="940" y1="281.2" y2="281.2" stroke="#e5e7eb"/><text x="64" y="285.2" text-anchor="end" fill="#6b7280">1000</text>
<line x1="70" x2="940" y1="232.4" y2="232.4" stroke="#e5e7eb"/><text x="64" y="236.4" text-anchor="end" fill="#6b7280">2000</text>
<line x1="70" x2="940" y1="183.6" y2="183.6" stroke="#e5e7eb"/><text x="64" y="187.6" text-anchor="end" fill="#6b7280">3000</text>
<line x1="70" x2="940" y1="134.8" y2="134.8" stroke="#e5e7eb"/><text x="64" y="138.8" text-anchor="end" fill="#6b7280">4000</text>
<line x1="70" x2="940" y1="86.0" y2="86.0" stroke="#e5e7eb"/><text x="64" y="90.0" text-anchor="end" fill="#6b7280">5000</text>
<text transform="translate(16,208) rotate(-90)" text-anchor="middle" fill="#374151">operations per second</text>
<rect x="131.0" y="213.6" width="54.0" height="116.4" fill="#6b7280"><title>single-row (original), hot90-c8-n10000: median 2385.9 (min 2297, max 2754.2)</title></rect>
<line x1="158.0" x2="158.0" y1="217.9" y2="195.6" stroke="#111827" stroke-width="1"/><text x="158.0" y="190.6" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2,386</text><line x1="155.0" x2="161.0" y1="217.9" y2="217.9" stroke="#111827"/><line x1="155.0" x2="161.0" y1="195.6" y2="195.6" stroke="#111827"/>
<rect x="187.0" y="192.0" width="54.0" height="138.0" fill="#2563eb"><title>sharding off (new code, disabled), hot90-c8-n10000: median 2826.9 (min 2391.5, max 2918.1)</title></rect>
<line x1="214.0" x2="214.0" y1="213.3" y2="187.6" stroke="#111827" stroke-width="1"/><text x="214.0" y="182.6" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2,827</text><line x1="211.0" x2="217.0" y1="213.3" y2="213.3" stroke="#111827"/><line x1="211.0" x2="217.0" y1="187.6" y2="187.6" stroke="#111827"/>
