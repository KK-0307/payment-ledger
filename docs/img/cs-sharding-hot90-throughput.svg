<text transform="translate(509.0,344.0) rotate(-40)" text-anchor="end" fill="#374151">32 workers</text>
<rect x="711.0" y="213.7" width="54.0" height="116.3" fill="#6b7280"><title>single-row (original), hot90-c128-n10000: median 2383.7 (min 2063.7, max 2509.6)</title></rect>
<line x1="738.0" x2="738.0" y1="229.3" y2="207.5" stroke="#111827" stroke-width="1"/><text x="738.0" y="202.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2,384</text><line x1="735.0" x2="741.0" y1="229.3" y2="229.3" stroke="#111827"/><line x1="735.0" x2="741.0" y1="207.5" y2="207.5" stroke="#111827"/>
