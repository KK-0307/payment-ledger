<rect x="823.0" y="126.2" width="54.0" height="203.8" fill="#d97706"><title>sharding on (default), hot90-c128-n10000: median 4175.5 (min 3753.8, max 4252)</title></rect>
<line x1="850.0" x2="850.0" y1="146.8" y2="122.5" stroke="#111827" stroke-width="1"/><text x="850.0" y="117.5" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">4,176</text><line x1="847.0" x2="853.0" y1="146.8" y2="146.8" stroke="#111827"/><line x1="847.0" x2="853.0" y1="122.5" y2="122.5" stroke="#111827"/>
<text transform="translate(799.0,344.0) rotate(-40)" text-anchor="end" fill="#374151">128 workers</text>
<line x1="70" x2="940" y1="330.0" y2="330.0" stroke="#9ca3af"/>
<text x="70" y="454" fill="#6b7280" font-size="11">Bars: median of the runs. Whiskers: min–max.</text>
