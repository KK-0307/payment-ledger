<line x1="504.0" x2="504.0" y1="225.7" y2="196.0" stroke="#111827" stroke-width="1"/><text x="504.0" y="191.0" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">2,704</text><line x1="501.0" x2="507.0" y1="225.7" y2="225.7" stroke="#111827"/><line x1="501.0" x2="507.0" y1="196.0" y2="196.0" stroke="#111827"/>
