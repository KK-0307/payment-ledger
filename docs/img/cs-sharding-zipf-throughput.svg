<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="system-ui, sans-serif" font-size="12" role="img" aria-label="Merchant sharding: throughput on the suite&#39;s own Zipf merchant mix (about 21% to the top merchant)">
<title>Merchant sharding: throughput on the suite&#39;s own Zipf merchant mix (about 21% to the top merchant)</title>
<rect width="960" height="460" fill="#ffffff"/>
<text x="70" y="22" font-size="15" font-weight="600" fill="#111827">Merchant sharding: throughput on the suite&#39;s own Zipf merchant mix (about 21% to the top merchant)</text>
<text x="70" y="38" font-size="11" fill="#4b5563">Closed loop, 10,000 payment operations, one API instance, Stripe simulator, no injected faults, no retries needed.</text>
<text x="70" y="53" font-size="11" fill="#4b5563">Median of 5 interleaved rounds per arm (whiskers: min-max). Apple M4 Max laptop, PostgreSQL 16; every component shares the host.</text>
<text x="70" y="68" font-size="11" fill="#4b5563">Differences under roughly 20% are inside the run-to-run noise (the sharding-off arm differs from single-row by up to 21%).</text>
<rect x="70" y="78" width="10" height="10" fill="#6b7280"/><text x="84" y="87" fill="#374151">single-row (original)</text>
<rect x="241" y="78" width="10" height="10" fill="#2563eb"/><text x="255" y="87" fill="#374151">sharding off (new code, disabled)</text>
<rect x="496" y="78" width="10" height="10" fill="#d97706"/><text x="510" y="87" fill="#374151">sharding on (default)</text>
<line x1="70" x2="940" y1="330.0" y2="330.0" stroke="#e5e7eb"/><text x="64" y="334.0" text-anchor="end" fill="#6b7280">0</text>
<line x1="70" x2="940" y1="284.2" y2="284.2" stroke="#e5e7eb"/><text x="64" y="288.2" text-anchor="end" fill="#6b7280">1000</text>
<line x1="70" x2="940" y1="238.4" y2="238.4" stroke="#e5e7eb"/><text x="64" y="242.4" text-anchor="end" fill="#6b7280">2000</text>
<line x1="70" x2="940" y1="192.6" y2="192.6" stroke="#e5e7eb"/><text x="64" y="196.6" text-anchor="end" fill="#6b7280">3000</text>
<line x1="70" x2="940" y1="146.8" y2="146.8" stroke="#e5e7eb"/><text x="64" y="150.8" text-anchor="end" fill="#6b7280">4000</text>
<line x1="70" x2="940" y1="101.0" y2="101.0" stroke="#e5e7eb"/><text x="64" y="105.0" text-anchor="end" fill="#6b7280">5000</text>
<text transform="translate(16,216) rotate(-90)" text-anchor="middle" fill="#374151">operations per second</text>
